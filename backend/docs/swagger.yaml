info:
  contact: {}
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: รับ email + password คืน JWT access/refresh token
      parameters:
      - description: ข้อมูลเข้าสู่ระบบ
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
