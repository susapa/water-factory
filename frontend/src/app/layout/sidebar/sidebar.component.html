<nav class="sidebar">
  <div class="sidebar-logo">
    <span class="pi pi-tint logo-icon"></span>
    <span class="logo-text">WaterFactory</span>
  </div>
  <ul class="nav-list">
    <li *ngFor="let item of visibleItems()" class="nav-item">
      <a [routerLink]="item.route"
         routerLinkActive="active"
         class="nav-link">
        <span [class]="item.icon + ' nav-icon'"></span>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    </li>
  </ul>
</nav>
