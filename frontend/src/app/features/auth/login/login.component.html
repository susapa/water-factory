<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <span class="pi pi-tint logo-icon"></span>
      <h1>WaterFactory</h1>
      <p>ระบบจัดการโรงงานน้ำดื่ม</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">
      <div class="field">
        <label for="email">อีเมล</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="admin@water.local"
          autocomplete="email"
        />
        <small *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="error">
          กรุณากรอกอีเมลที่ถูกต้อง
        </small>
      </div>

      <div class="field">
        <label for="password">รหัสผ่าน</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />
        <small *ngIf="form.get('password')?.invalid && form.get('password')?.touched" class="error">
          กรุณากรอกรหัสผ่าน
        </small>
      </div>

      <div *ngIf="errorMsg" class="error-box">{{ errorMsg }}</div>

      <button type="submit" [disabled]="loading" class="login-btn">
        <span *ngIf="loading" class="pi pi-spin pi-spinner"></span>
        <span *ngIf="!loading">เข้าสู่ระบบ</span>
      </button>
    </form>
  </div>
</div>
