<div class="filter-bar">
  <label class="filter-label">
    ตั้งแต่
    <input type="date" class="date-input" [value]="dateFrom()" (change)="dateFrom.set($any($event.target).value)" />
  </label>
  <label class="filter-label">
    ถึง
    <input type="date" class="date-input" [value]="dateTo()" (change)="dateTo.set($any($event.target).value)" />
  </label>
  @if (dateFrom() || dateTo()) {
    <button class="clear-btn" (click)="dateFrom.set(''); dateTo.set('')">ล้างตัวกรอง</button>
  }
  <span class="result-count">{{ filtered().length }} รายการ</span>
</div>

<p-table [value]="filtered()" [loading]="loading()" [tableStyle]="{'min-width':'55rem'}" styleClass="p-datatable-sm">
  <ng-template #header>
    <tr>
      <th pSortableColumn="order_number">เลขที่ใบสั่งขาย <p-sortIcon field="order_number" /></th>
      <th pSortableColumn="customer_name">ลูกค้า <p-sortIcon field="customer_name" /></th>
      <th pSortableColumn="order_date">วันที่ <p-sortIcon field="order_date" /></th>
      <th>สถานะ</th>
      <th pSortableColumn="total_amount" style="text-align:right">ยอดรวม (บาท) <p-sortIcon field="total_amount" /></th>
    </tr>
  </ng-template>
  <ng-template #body let-row>
    <tr>
      <td>{{ row.order_number }}</td>
      <td>{{ row.customer_name }}</td>
      <td>{{ row.order_date }}</td>
      <td><p-tag [value]="row.status" [severity]="statusSeverity(row.status)" /></td>
      <td style="text-align:right">{{ row.total_amount | number:'1.2-2' }}</td>
    </tr>
  </ng-template>
  <ng-template #footer>
    <tr class="footer-row">
      <td colspan="4" style="font-weight:600">รวมทั้งหมด</td>
      <td style="text-align:right;font-weight:700">{{ total() | number:'1.2-2' }}</td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr><td colspan="5" style="text-align:center;padding:2rem;color:var(--text-color-secondary)">ไม่มีข้อมูลคำสั่งขาย</td></tr>
  </ng-template>
</p-table>
