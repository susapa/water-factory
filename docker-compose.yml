services:
  postgres:
    image: postgres:17-alpine
    container_name: water_postgres
    environment:
      POSTGRES_DB: water_factory
      POSTGRES_USER: water_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U water_user -d water_factory"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - water_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: water_backend
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: water_factory
      DB_USER: water_user
      APP_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - water_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: water_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - water_net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  water_net:
    driver: bridge
